<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Antamina · Mapa</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>

<div class="app">

    <!-- MAPA A PANTALLA COMPLETA -->
    <main id="map-container">
        <div id="map"></div>

        <button
            id="btn-ubicacion"
            title="Mi ubicación"
            aria-label="Mostrar mi ubicación">

            <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    fill="#4285f4"
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
            </svg>

        </button>

    </main>


    <!-- CABECERA -->
    <section class="top-ui">

        <div class="left-ui">

            <div class="brand">

                <div class="brand-icon">
                    ⚡
                </div>

                <div>
                    <div class="brand-name">
                        ANTAMINA
                    </div>

                    <div class="brand-subtitle">
                        Mapa de lugares
                    </div>
                </div>

            </div>


            <!-- BUSCADOR -->
            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="search"
                    type="search"
                    placeholder="Buscar lugar..."
                    autocomplete="off">

            </div>


            <!-- RESULTADOS DEL BUSCADOR -->
            <div id="results"></div>

            <div id="stats">
                Cargando lugares...
            </div>


            <!-- FILTROS (tipo + carpeta) -->
            <div class="filter-bar">

                <div class="type-filter" id="type-filter">
                    <button class="type-btn active" data-type="all">Todo</button>
                    <button class="type-btn" data-type="Point">Puntos</button>
                    <button class="type-btn" data-type="Polygon">Polígonos</button>
                    <button class="type-btn" data-type="LineString">Rutas</button>
                </div>

                <div class="divider"></div>

                <div class="folder-filter">
                    <select id="folder-select" aria-label="Filtrar por carpeta">
                        <option value="__all__">Todas</option>
                    </select>
                </div>

            </div>

        </div>

    </section>

    <footer class="footer">
        Antamina · Mapa de lugares · 2026
    </footer>

</div>


<!-- LIBRERÍAS EXTERNAS (deben cargar ANTES de js/app.js) -->

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

<!-- MÓDULO PRINCIPAL -->
<script type="module" src="js/app.js"></script>

</body>

</html>
